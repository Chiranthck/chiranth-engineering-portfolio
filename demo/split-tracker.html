<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split Tracker — try it</title>
<!--
  ============================================================
  INTERACTIVE DEMO — self-contained, offline, no account.

  Differences from the real app, stated plainly:
    * State lives in a JavaScript object and is gone on reload.
      The real app uses Postgres via Supabase with row-level
      security. Nothing here is saved, which is deliberate: every
      visitor gets a clean demo and no one's data is stored.
    * The meal-photo estimate returns canned results. The real
      app sends the image to a vision model through an
      authenticated server function. This file makes no network
      requests of any kind.

  Everything else is the real logic: the per-set ramp, the earned
  progression rule, the stall analysis and the calorie maths are
  the same calculations the app runs.
  ============================================================
-->
<style>
:root{
  --bg:#0e1116; --card:#161b23; --card-alt:#1d242e; --line:#242c38;
  --text:#e8edf4; --dim:#9aa4b2; --blue:#60a5fa; --green:#4ade80;
  --yellow:#facc15; --red:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0a0d12;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}

/* Whole thing is capped to phone width and centred, so it looks right
   both standalone and in an iframe on a desktop page. */
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;
  border-left:1px solid #1a212b;border-right:1px solid #1a212b}

.demo-note{background:rgba(96,165,250,.1);border-bottom:1px solid rgba(96,165,250,.25);
  padding:9px 14px;font-size:11px;color:#a9c7f0;line-height:1.45;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.demo-note button{background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.4);
  color:#cfe0f8;border-radius:7px;font-size:10.5px;padding:4px 9px;font-family:inherit;
  cursor:pointer;flex:0 0 auto}

.topbar{padding:14px 16px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.app-title{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.app-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.selects{display:flex;gap:7px;margin-top:11px}
.selects select{flex:1;background:var(--card-alt);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit}

.content{flex:1;padding:4px 16px 24px;overflow-y:auto}

.bottomnav{flex:0 0 auto;border-top:1px solid var(--line);background:var(--card);
  position:sticky;bottom:0}
.bottomnav-inner{display:flex}
.nav-btn{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;
  padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;cursor:pointer}
.nav-btn.active{color:var(--blue)}
.nav-ico{font-size:16px;line-height:1}

.day-strip{display:flex;gap:5px;margin:12px 0 2px}
.day-pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--dim);font-family:inherit;cursor:pointer}
.day-pill-name{font-size:10.5px;font-weight:600}
.day-pill-sub{font-size:9px;opacity:.75}
.day-pill.active{background:var(--blue);border-color:var(--blue);color:#07111f}
.day-pill.skipped{opacity:.55}
.day-pill.skipped .day-pill-sub{color:var(--yellow)}
.day-pill.has{border-color:#33405280}

.day-name-input{width:100%;background:transparent;border:none;
  border-bottom:1px dashed rgba(255,255,255,.22);color:inherit;font-size:21px;font-weight:700;
  letter-spacing:-0.01em;padding:6px 2px 8px;font-family:inherit;margin:14px 0 4px}
.day-name-input::placeholder{font-size:15px;font-weight:500;opacity:.4}
.day-name-input:focus{outline:none;border-bottom-color:rgba(96,165,250,.75)}

.block-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;
  margin:16px 0 8px;color:var(--blue)}
.block-label.cond{color:var(--yellow)}
.day-sub{color:var(--dim);font-size:12px;margin:-2px 0 10px;line-height:1.5}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px}
.card.dashed{border-style:dashed}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-size:14.5px;font-weight:650;letter-spacing:-0.01em}
.ex-meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.notes{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:7px}

.target{background:var(--card-alt);border-radius:8px;padding:7px 9px;font-size:11px;
  color:var(--dim);min-width:88px;text-align:center;line-height:1.35;font-family:inherit;
  border:1px dashed rgba(255,255,255,.2);cursor:pointer}
.target b{color:var(--text);font-size:13px;display:block}
.target .hint{display:block;margin-top:3px;font-size:8.5px;letter-spacing:.04em;
  text-transform:uppercase;opacity:.45}
.target.plain{border-style:solid;cursor:default}

.ramp{font-size:11px;color:var(--blue);background:rgba(96,165,250,.08);
  border-radius:7px;padding:6px 9px;margin-top:10px}

.sets{display:grid;gap:7px;margin-top:10px}
.set-box label{display:block;font-size:9px;color:var(--dim);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.05em}
.set-box input{width:100%;background:var(--card-alt);border:1px solid var(--line);
  border-radius:8px;color:var(--text);padding:9px 4px;text-align:center;font-size:14px;
  font-family:inherit;font-weight:600}
.set-box input:focus{outline:none;border-color:var(--blue)}
.set-box input.filled{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.07)}
.set-box input::placeholder{color:#55606f;font-weight:400}

.adjust{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.mini{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-size:11px;padding:4px 9px;font-family:inherit;cursor:pointer}
.mini.push{margin-left:auto}
.mini.del{color:var(--red);border-color:rgba(248,113,113,.28)}
.adjust .note{font-size:9.5px;color:var(--dim);opacity:.6}

.notice{font-size:11px;margin-top:9px;line-height:1.45;min-height:1px}
.notice.good{color:var(--green)}
.notice.warn{color:var(--yellow)}

.btn{width:100%;background:var(--blue);color:#07111f;border:none;border-radius:9px;
  padding:11px;font-size:13px;font-weight:650;font-family:inherit;margin-top:11px;cursor:pointer}
.btn.sec{background:var(--card-alt);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid rgba(248,113,113,.3);font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px}
.btn-row .btn{margin-top:8px}

.input{width:100%;background:var(--card-alt);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:10px;font-size:13px;font-family:inherit}
.input:focus{outline:none;border-color:var(--blue)}
.input::placeholder{color:#55606f}
.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);margin:10px 0 5px}
.checkrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:11px 0;cursor:pointer}

.empty-title{font-size:14.5px;font-weight:700;margin-bottom:4px}

.skip-banner{display:flex;justify-content:space-between;align-items:flex-start;gap:13px;
  background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.32);border-radius:12px;
  padding:12px 14px;margin:12px 0 4px;font-size:12.5px;line-height:1.5}
.skip-banner b{color:var(--yellow)}
.skip-note{margin-top:5px;font-size:11px;opacity:.62}
.skip-undo{background:rgba(250,204,21,.16);border:1px solid rgba(250,204,21,.4);color:var(--yellow);
  border-radius:9px;padding:6px 13px;font-size:12px;font-weight:600;font-family:inherit;
  cursor:pointer;flex:0 0 auto}

.kcal-big{font-size:34px;font-weight:750;letter-spacing:-0.03em;line-height:1}
.kcal-big small{font-size:15px;color:var(--dim);font-weight:500}
.kcal-sub{font-size:11.5px;color:var(--dim);margin-top:5px}
.macro{margin-top:12px}
.macro-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.macro-label b{color:var(--text)}
.macro-bar{height:7px;background:var(--card-alt);border-radius:99px;overflow:hidden}
.macro-fill{height:100%;border-radius:99px;transition:width .25s}

.meal-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.meal-row:last-child{border-bottom:none}
.meal-sub{font-size:10.5px;color:var(--dim);margin-top:2px}
.g-input{background:var(--card-alt);border:1px solid var(--line);border-radius:7px;
  width:64px;padding:6px;color:var(--text);text-align:center;font-size:12px;font-family:inherit}

.badge{font-size:8.5px;font-weight:700;letter-spacing:.07em;padding:3px 7px;border-radius:5px;
  text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
.badge.good{background:rgba(74,222,128,.14);color:var(--green)}
.badge.bad{background:rgba(248,113,113,.14);color:var(--red)}
.badge.warn{background:rgba(250,204,21,.14);color:var(--yellow)}
.badge.neutral{background:var(--card-alt);color:var(--dim)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
  justify-content:center;z-index:50}
.sheet-inner{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;
  width:100%;max-width:430px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:4px}
.sheet-sub{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:14px}

.cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.cam-view{flex:1;background:
  radial-gradient(circle at 42% 44%, #4a3b26 0 14%, transparent 15%),
  radial-gradient(circle at 60% 58%, #3f4a2c 0 11%, transparent 12%),
  repeating-linear-gradient(42deg,#1c1f16,#1c1f16 22px,#232719 22px,#232719 44px)}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:17px 22px 22px;background:#000}
.cam-shutter{width:62px;height:62px;border-radius:50%;background:#fff;
  border:4px solid rgba(255,255,255,.35);box-shadow:0 0 0 3px #000 inset;cursor:pointer}
.cam-side{background:none;border:none;color:#fff;font-size:14px;font-weight:600;
  min-width:54px;font-family:inherit;cursor:pointer}
.cam-msg{position:absolute;left:0;right:0;bottom:112px;text-align:center;color:#fff;
  font-size:12.5px;padding:0 26px;text-shadow:0 1px 3px rgba(0,0,0,.8)}

.spark{display:block;margin-top:10px;width:100%;height:46px}
.wk-chart{display:flex;align-items:flex-end;gap:6px;height:74px;margin-top:12px;position:relative}
.wk-bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;opacity:.8;min-height:2px}
.wk-target{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.3)}
.wk-days{display:flex;gap:6px;margin-top:5px}
.wk-days span{flex:1;text-align:center;font-size:9px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div class="demo-note">
    <span id="demo-msg">Demo — nothing is saved, and it makes no network calls. Reload for a clean slate.</span>
    <button id="reset-demo">Reset</button>
  </div>
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <div class="app-title" id="top-title">Train</div>
        <div class="app-sub" id="top-sub"></div>
      </div>
      <span class="badge neutral" id="top-badge"></span>
    </div>
    <div class="selects" id="selects">
      <select id="month-sel"></select>
      <select id="week-sel"></select>
    </div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottomnav"><div class="bottomnav-inner" id="nav"></div></nav>
</div>

<script>
"use strict";
/* ===========================================================
   STATE — plain object, in memory only.
   No localStorage, no sessionStorage, no fetch. Reloading the
   page resets everything, by design.
   =========================================================== */
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const WEEKS = [
  {n:1, label:"Week 1 — build"},
  {n:2, label:"Week 2 — build"},
  {n:3, label:"Week 3 — heavy"},
  {n:4, label:"Week 4 — deload"},
];
const MONTHS = ["2026-09","2026-10","2026-11"];

function freshState(){
  return {
    tab:"train",
    month:"2026-10",
    week:3,
    day:1,
    // program[month][day] = {title, exercises:[{id,name,reps,bw}]}
    program:{
      "2026-09":{
        1:{title:"Chest & Triceps", exercises:[
          {id:id(), name:"Incline Bench Press", reps:[12,10,8,6], bw:false},
          {id:id(), name:"Cable Fly", reps:[15,12,12], bw:false},
        ]},
        4:{title:"Back & Biceps", exercises:[
          {id:id(), name:"Barbell Bent-over Row", reps:[12,10,8,8], bw:false},
          {id:id(), name:"Pull Up", reps:[10,10,"F"], bw:true},
        ]},
      },
      "2026-10":{
        1:{title:"Chest & Triceps", exercises:[
          {id:id(), name:"Incline Bench Press", reps:[12,10,8,6], bw:false},
          {id:id(), name:"Cable Fly", reps:[15,12,12], bw:false},
          {id:id(), name:"Overhead Triceps Extension", reps:[12,12,10], bw:false},
        ]},
        4:{title:"Back & Biceps", exercises:[
          {id:id(), name:"Barbell Bent-over Row", reps:[12,10,8,8], bw:false},
          {id:id(), name:"Pull Up", reps:[10,10,"F"], bw:true},
        ]},
      },
      "2026-11":{},
    },
    // lifts[name] = {target, inc}
    lifts:{
      "Incline Bench Press":{target:62.5, inc:2.5},
      "Cable Fly":{target:22.5, inc:1.25},
      "Overhead Triceps Extension":{target:25, inc:1.25},
      "Barbell Bent-over Row":{target:70, inc:2.5},
    },
    // logs["month|week|day|name"] = [ "45","50", ... ]
    logs:{
      "2026-09|3|1|Incline Bench Press":["45","50","55","57.5"],
      "2026-10|1|1|Incline Bench Press":["42.5","47.5","52.5","57.5"],
      "2026-10|2|1|Incline Bench Press":["45","50","55","60"],
      "2026-09|3|4|Barbell Bent-over Row":["50","57.5","65","70"],
      "2026-10|2|4|Barbell Bent-over Row":["50","57.5","65","70"],
    },
    skipped:{},                       // "month|week|day" -> reason
    bodyweight:[                      // demo trend
      {d:"2026-09-07", kg:69.8, bf:14.2},
      {d:"2026-09-21", kg:70.2, bf:14.0},
      {d:"2026-10-05", kg:70.6, bf:13.8},
      {d:"2026-10-19", kg:71.1, bf:13.7},
      {d:"2026-10-26", kg:71.4, bf:13.6},
    ],
    profile:{weightKg:71.4, bfPct:13.6, activity:1.55, goal:"lean_bulk"},
    meals:[
      {name:"Oats, milk, banana", kcal:520, p:22, c:82, f:11},
      {name:"Chicken, rice, salad", kcal:712, p:41, c:58, f:35},
      {name:"Whey + peanut butter", kcal:390, p:34, c:14, f:22},
    ],
    week7:[2290,2680,2510,2120,2740,2600,2410],  // last 7 days kcal, demo
    pendingMeal:null,
    camOpen:false,
    sheet:null,
  };
}
let seq = 0;
function id(){ return "x" + (++seq); }
let S = freshState();

/* ===========================================================
   MATHS — the real calculations from the app
   =========================================================== */
const round1 = n => Math.round(n*10)/10;
function roundTo(n, step){ return Math.round(n/step)*step; }

// Epley: a one-rep max estimated from the top set, then solved back
// per rep count to suggest a weight for each earlier set.
function computeRamp(top, reps, step){
  if (!top) return reps.map(()=>null);
  const numeric = reps.map(r => (r==="F" ? null : Number(r)));
  const valid = numeric.filter(n => n!=null && n>0);
  if (!valid.length) return reps.map(()=>null);
  const topReps = Math.min(...valid);
  const oneRM = top * (1 + topReps/30);
  return numeric.map(r => r==null ? null : roundTo(oneRM/(1 + r/30), step));
}
function targetForWeek(target, week, step){
  if (!target) return null;
  if (week === 4) return roundTo(target*0.9, step);   // planned deload
  return round1(target);
}
function nextTarget(target, achieved, inc, step){
  return roundTo(Math.max(achieved, target) + inc, step);
}
function stepFor(lift){ return (lift && lift.inc && lift.inc < 2.5) ? 1.25 : 2.5; }

function parseReps(text){
  return String(text||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>{
    if (/^f(ailure)?$/i.test(t)) return "F";
    const n = parseInt(t,10);
    return (!isNaN(n) && String(n)===t) ? n : t;
  });
}

// Calorie target. Katch-McArdle when body fat is known, because it
// works off lean mass; Mifflin-St Jeor otherwise.
const GOALS = {
  lean_bulk:{label:"Lean bulk", mult:1.10, protein:2.0, fatPct:0.27},
  recomp:   {label:"Recomp",    mult:1.00, protein:2.2, fatPct:0.30},
  cut:      {label:"Cut",       mult:0.82, protein:2.4, fatPct:0.30},
};
function calcPlan(p){
  const g = GOALS[p.goal];
  let bmr;
  if (p.bfPct > 0){
    const lean = p.weightKg * (1 - p.bfPct/100);
    bmr = 370 + 21.6*lean;                      // Katch-McArdle
  } else {
    bmr = 10*p.weightKg + 6.25*175 - 5*28 + 5;  // Mifflin-St Jeor
  }
  const tdee = bmr * p.activity;
  const kcal = Math.round(tdee * g.mult / 10) * 10;
  const protein = Math.round(p.weightKg * g.protein);
  const fat = Math.round(kcal * g.fatPct / 9);
  const carbs = Math.round((kcal - protein*4 - fat*9) / 4);
  return {kcal, protein, carbs, fat, goalLabel:g.label,
          bmr:Math.round(bmr), tdee:Math.round(tdee),
          method: p.bfPct>0 ? "Katch-McArdle (uses lean mass)" : "Mifflin-St Jeor"};
}

/* ===========================================================
   HELPERS
   =========================================================== */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logKey = (m,w,d,n) => `${m}|${w}|${d}|${n}`;
const skipKey = (m,w,d) => `${m}|${w}|${d}`;
const monthLabel = m => {
  const [y,mo] = m.split("-").map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
};
function dayOf(month, day){
  return (S.program[month] && S.program[month][day]) || null;
}
function exercisesOf(month, day){
  const d = dayOf(month, day);
  return d ? d.exercises : [];
}
function isSkipped(){ return S.skipped[skipKey(S.month,S.week,S.day)] !== undefined; }

/* ===========================================================
   RENDER
   =========================================================== */
const content = () => document.getElementById("content");

function render(){
  renderNav();
  if (S.tab === "train")   renderTrain();
  if (S.tab === "diet")    renderDiet();
  if (S.tab === "stats")   renderStats();
  if (S.tab === "setup")   renderSetup();
  renderCam();
  renderSheet();
}

function renderNav(){
  const items = [
    {k:"train", ico:"▦", label:"Train"},
    {k:"diet",  ico:"◍", label:"Diet"},
    {k:"stats", ico:"◈", label:"Stats"},
    {k:"setup", ico:"⚙", label:"Setup"},
  ];
  const nav = document.getElementById("nav");
  nav.innerHTML = items.map(i =>
    `<button class="nav-btn ${S.tab===i.k?"active":""}" data-tab="${i.k}">
       <span class="nav-ico">${i.ico}</span><span>${i.label}</span></button>`).join("");
  nav.querySelectorAll("[data-tab]").forEach(b =>
    b.onclick = () => { S.tab = b.dataset.tab; render(); });

  document.getElementById("selects").style.display = (S.tab==="train") ? "flex" : "none";

  const mo = document.getElementById("month-sel");
  mo.innerHTML = MONTHS.map(m =>
    `<option value="${m}" ${m===S.month?"selected":""}>${esc(monthLabel(m))}</option>`).join("");
  mo.onchange = () => { S.month = mo.value; render(); };

  const wk = document.getElementById("week-sel");
  wk.innerHTML = WEEKS.map(w =>
    `<option value="${w.n}" ${w.n===S.week?"selected":""}>${esc(w.label)}</option>`).join("");
  wk.onchange = () => { S.week = Number(wk.value); render(); };
}

function setHeader(title, sub, badge, badgeClass){
  document.getElementById("top-title").textContent = title;
  document.getElementById("top-sub").textContent = sub || "";
  const b = document.getElementById("top-badge");
  b.textContent = badge || "";
  b.className = "badge " + (badgeClass || "neutral");
  b.style.display = badge ? "" : "none";
}

/* ---------------- TRAIN ---------------- */
function dayStrip(){
  return `<div class="day-strip">` + DAYS.map((name,i)=>{
    const d = i+1;
    const skipped = S.skipped[skipKey(S.month,S.week,d)] !== undefined;
    const has = exercisesOf(S.month,d).length > 0;
    const cls = ["day-pill", d===S.day?"active":"", skipped?"skipped":"", has?"has":""]
      .filter(Boolean).join(" ");
    return `<button class="${cls}" data-day="${d}">
      <span class="day-pill-name">${name.slice(0,3)}</span>
      <span class="day-pill-sub">${skipped?"Skip":"D"+d}</span></button>`;
  }).join("") + `</div>`;
}

function renderTrain(){
  const prog = dayOf(S.month, S.day);
  const list = exercisesOf(S.month, S.day);
  const skipReason = S.skipped[skipKey(S.month,S.week,S.day)];

  setHeader(`Day ${S.day} · ${DAYS[S.day-1]}`,
            prog && prog.title ? prog.title : "Not set up yet",
            skipReason!==undefined ? "Skipped" : (WEEKS.find(w=>w.n===S.week)||{}).label.split("—")[1].trim(),
            skipReason!==undefined ? "warn" : "neutral");

  let h = dayStrip();
  h += `<input class="day-name-input" id="day-name"
          value="${esc(prog ? prog.title : "")}"
          placeholder="What are you training?">`;

  if (skipReason !== undefined){
    h += `<div class="skip-banner">
      <div><b>Skipped</b> — ${esc((WEEKS.find(w=>w.n===S.week)||{}).label)}
        ${skipReason ? `<div style="margin-top:3px">${esc(skipReason)}</div>` : ""}
        <div class="skip-note">Left out of stalled-lift checks, so it won't look like a plateau.</div>
      </div>
      <button class="skip-undo" id="unskip">Undo</button></div>`;
  }

  if (!list.length){
    h += `<div class="card">
      <div class="empty-title">Nothing here yet</div>
      <div class="notes">Name the day above, then add the exercises you're doing.
        They'll be here every week this month.</div>
      ${hasEarlier(S.day) ? `<button class="btn sec" id="copy-prev">Copy this day from a previous month</button>` : ""}
    </div>`;
  }

  list.forEach(ex => { h += exerciseCard(ex, skipReason!==undefined); });

  h += `<div class="card dashed">
    <input class="input" id="new-name" placeholder="Exercise name">
    <label class="flabel">Sets × reps</label>
    <input class="input" id="new-reps" value="12, 10, 8">
    <label class="checkrow"><input type="checkbox" id="new-bw">
      No weight — bodyweight only (pull-ups, planks)</label>
    <button class="btn" id="add-ex">Add to this day</button>
    <div class="notice" id="add-msg"></div>
    <div class="notes" style="opacity:.6">One number per set, separated by commas.
      "12, 10, 8" is three sets. Type F for a set to failure.</div>
    ${list.length ? `<button class="btn danger" id="clear-day">Clear all ${list.length} exercise${list.length===1?"":"s"} from this day</button>` : ""}
  </div>`;

  if (skipReason === undefined){
    h += `<div class="card">
      <div class="notes" style="margin:0">Didn't train this one? Mark it skipped so it
        isn't read as a plateau later.</div>
      <button class="btn sec" id="skip-day">Skip this day</button></div>`;
  }

  content().innerHTML = h;
  wireTrain();
}

function exerciseCard(ex, dimmed){
  const lift = S.lifts[ex.name];
  const step = stepFor(lift);
  const target = ex.bw ? null : targetForWeek(lift ? lift.target : 0, S.week, step);
  const label = ex.bw ? "Bodyweight" : (target ? target + " kg" : "First time");
  const ramp = ex.bw ? [] : computeRamp(target, ex.reps, step);
  const saved = S.logs[logKey(S.month,S.week,S.day,ex.name)] || [];

  const rampTxt = ramp.filter(r=>r!=null).length
    ? `<div class="ramp">Ramp · ${ramp.map(r=>r==null?"—":r).join(" → ")} kg</div>` : "";

  const boxes = ex.reps.map((rep,i)=>{
    const val = saved[i]!==undefined ? saved[i] : "";
    const ph = ramp[i]!=null ? String(ramp[i]) : (ex.bw ? "reps" : "kg");
    return `<div class="set-box">
      <label>Set ${i+1} <span>×${rep==="F"?"F":rep}</span></label>
      <input type="text" inputmode="decimal" class="${val?"filled":""}"
        data-set-ex="${esc(ex.id)}" data-set-i="${i}"
        placeholder="${esc(ph)}" value="${esc(val)}"></div>`;
  }).join("");

  return `<div class="card" style="${dimmed?"opacity:.6":""}">
    <div class="row">
      <div>
        <div class="ex-name">${esc(ex.name)}</div>
        <div class="ex-meta">${ex.reps.map(r=>r==="F"?"Failure":r).join(" · ")}</div>
      </div>
      ${ex.bw
        ? `<div class="target plain">Top set<b>${label}</b></div>`
        : `<button class="target" data-settarget="${esc(ex.id)}">Top set<b>${label}</b>
             <span class="hint">tap to change</span></button>`}
    </div>
    ${rampTxt}
    <div class="sets" style="grid-template-columns:repeat(${Math.min(ex.reps.length,4)},1fr)">${boxes}</div>
    <div class="adjust">
      <button class="mini" data-addset="${esc(ex.id)}">+ set</button>
      <button class="mini" data-dropset="${esc(ex.id)}">− set</button>
      <span class="note">just for today</span>
      <button class="mini push" data-editex="${esc(ex.id)}">Edit</button>
      <button class="mini del" data-delex="${esc(ex.id)}">Remove</button>
    </div>
    <div class="notice good" data-notice="${esc(ex.id)}"></div>
  </div>`;
}

function hasEarlier(day){
  return MONTHS.some(m => m < S.month && exercisesOf(m, day).length > 0);
}

function wireTrain(){
  const q = s => content().querySelectorAll(s);

  q("[data-day]").forEach(b => b.onclick = () => { S.day = Number(b.dataset.day); render(); });

  const nameEl = document.getElementById("day-name");
  if (nameEl) nameEl.onblur = () => {
    const t = nameEl.value.trim();
    S.program[S.month] = S.program[S.month] || {};
    if (!S.program[S.month][S.day]) S.program[S.month][S.day] = {title:t, exercises:[]};
    else S.program[S.month][S.day].title = t;
    document.getElementById("top-sub").textContent = t || "Not set up yet";
  };

  // log a set
  q("[data-set-ex]").forEach(inp => {
    inp.oninput = () => {
      const ex = findEx(inp.dataset.setEx);
      if (!ex) return;
      const k = logKey(S.month,S.week,S.day,ex.name);
      const arr = S.logs[k] ? S.logs[k].slice() : [];
      arr[Number(inp.dataset.setI)] = inp.value.trim();
      S.logs[k] = arr;
      inp.classList.toggle("filled", !!inp.value.trim());
    };
    inp.onblur = () => {
      const ex = findEx(inp.dataset.setEx);
      if (ex) maybeAdvance(ex);
    };
  });

  q("[data-settarget]").forEach(b => b.onclick = () => openTargetSheet(findEx(b.dataset.settarget)));
  q("[data-editex]").forEach(b => b.onclick = () => openEditSheet(findEx(b.dataset.editex)));

  q("[data-delex]").forEach(b => b.onclick = () => {
    const ex = findEx(b.dataset.delex);
    if (!ex) return;
    if (!confirm(`Remove ${ex.name} from this day? Weights you've already logged are kept.`)) return;
    const d = dayOf(S.month,S.day);
    d.exercises = d.exercises.filter(e => e.id !== ex.id);
    render();
  });

  q("[data-addset]").forEach(b => b.onclick = () => {
    const ex = findEx(b.dataset.addset);
    const last = ex.reps[ex.reps.length-1];
    ex.reps = ex.reps.concat([last==="F" ? "F" : last]);
    render();
  });
  q("[data-dropset]").forEach(b => b.onclick = () => {
    const ex = findEx(b.dataset.dropset);
    if (ex.reps.length > 1) ex.reps = ex.reps.slice(0,-1);
    render();
  });

  const add = document.getElementById("add-ex");
  if (add) add.onclick = () => {
    const msg = document.getElementById("add-msg");
    const name = document.getElementById("new-name").value.trim();
    const reps = parseReps(document.getElementById("new-reps").value);
    const bw   = document.getElementById("new-bw").checked;
    if (!name){ msg.textContent = "Give it a name first."; msg.className="notice warn"; return; }
    if (!reps.length){ msg.textContent = 'How many reps per set? Something like "12, 10, 8".';
      msg.className="notice warn"; return; }

    S.program[S.month] = S.program[S.month] || {};
    const title = (document.getElementById("day-name").value||"").trim();
    if (!S.program[S.month][S.day]) S.program[S.month][S.day] = {title, exercises:[]};
    S.program[S.month][S.day].exercises.push({id:id(), name, reps, bw});
    // A new exercise has no target: the first weight logged becomes the baseline.
    if (!bw && !S.lifts[name]) S.lifts[name] = {target:0, inc:2.5};
    render();
  };

  const clear = document.getElementById("clear-day");
  if (clear) clear.onclick = () => {
    const d = dayOf(S.month,S.day);
    const n = d.exercises.length;
    if (!confirm(`Remove all ${n} exercise${n===1?"":"s"} from this day, for ${monthLabel(S.month)}?\n\nWeights you've already logged are kept. Other months aren't touched.`)) return;
    d.exercises = [];
    render();
  };

  const skip = document.getElementById("skip-day");
  if (skip) skip.onclick = () => {
    const r = prompt("Mark this day skipped. Add a note if you like (travel, ill, rest) — or leave it blank.", "");
    if (r === null) return;
    S.skipped[skipKey(S.month,S.week,S.day)] = r.trim();
    render();
  };
  const unskip = document.getElementById("unskip");
  if (unskip) unskip.onclick = () => {
    delete S.skipped[skipKey(S.month,S.week,S.day)];
    render();
  };

  const copy = document.getElementById("copy-prev");
  if (copy) copy.onclick = () => {
    const from = MONTHS.filter(m => m < S.month && exercisesOf(m,S.day).length).pop();
    if (!from) return;
    const src = dayOf(from, S.day);
    if (!confirm(`Copy ${src.exercises.length} exercises from ${monthLabel(from)} ("${src.title}") into this day?`)) return;
    S.program[S.month] = S.program[S.month] || {};
    S.program[S.month][S.day] = {
      title: src.title,
      exercises: src.exercises.map(e => ({id:id(), name:e.name, reps:e.reps.slice(), bw:e.bw})),
    };
    src.exercises.forEach(e => { if (!e.bw && !S.lifts[e.name]) S.lifts[e.name] = {target:0, inc:2.5}; });
    render();
  };
}

function findEx(exId){
  return exercisesOf(S.month,S.day).find(e => e.id === exId);
}

// Earned progression: the target only moves when you actually hit it.
function maybeAdvance(ex){
  if (ex.bw) return;
  const note = content().querySelector(`[data-notice="${ex.id}"]`);
  const setNote = (t,c) => { if (note){ note.textContent = t||""; note.className = "notice " + (c||""); } };

  if (isSkipped()){ setNote(""); return; }
  if (S.week === 4){ setNote("Deload week — hitting this won't move your target.", "warn"); return; }

  const lift = S.lifts[ex.name] || (S.lifts[ex.name] = {target:0, inc:2.5});
  const step = stepFor(lift);
  const vals = (S.logs[logKey(S.month,S.week,S.day,ex.name)] || [])
    .map(v => parseFloat(v)).filter(n => !isNaN(n) && n > 0);
  if (!vals.length){ setNote(""); return; }
  const achieved = Math.max(...vals);

  if (!lift.target){
    lift.target = achieved;
    setNote(`Starting point set at ${achieved}kg. Beat it next time and the target moves up.`, "good");
    refreshCard(ex);
    return;
  }
  if (achieved < lift.target){ setNote(""); return; }
  if (achieved > lift.target * 1.5){
    setNote(`${achieved}kg is a big jump from ${lift.target}kg — target left alone in case that's a typo.`, "warn");
    return;
  }
  const next = nextTarget(lift.target, achieved, lift.inc, step);
  if (next <= lift.target){ setNote(""); return; }
  lift.target = next;
  setNote(`Hit ${achieved}kg — target raised to ${next}kg.`, "good");
  refreshCard(ex);
}

// Update the target and ramp in place, so logging doesn't steal focus.
function refreshCard(ex){
  const btn = content().querySelector(`[data-settarget="${ex.id}"]`);
  if (!btn) return;
  const lift = S.lifts[ex.name];
  const step = stepFor(lift);
  const target = targetForWeek(lift.target, S.week, step);
  btn.querySelector("b").textContent = target ? target + " kg" : "First time";
  const card = btn.closest(".card");
  const ramp = computeRamp(target, ex.reps, step);
  const rampEl = card.querySelector(".ramp");
  const txt = `Ramp · ${ramp.map(r=>r==null?"—":r).join(" → ")} kg`;
  if (rampEl) rampEl.textContent = txt;
  card.querySelectorAll("[data-set-i]").forEach(inp => {
    const i = Number(inp.dataset.setI);
    if (ramp[i]!=null) inp.placeholder = String(ramp[i]);
  });
}

/* ---------------- sheets ---------------- */
function openTargetSheet(ex){
  if (!ex) return;
  const lift = S.lifts[ex.name] || {target:0, inc:2.5};
  S.sheet = {
    title:`Top-set target — ${ex.name}`,
    sub:"The weight you're working towards on your heaviest set. Earlier sets are suggested from it, and it rises on its own once you hit it.",
    fields:[
      {key:"target", label:"Target (kg)", value: lift.target || ""},
      {key:"inc",    label:"Goes up by (kg) each time you hit it", value: lift.inc},
    ],
    onSave(vals){
      const t = parseFloat(vals.target), i = parseFloat(vals.inc);
      if (isNaN(t) || t < 0) return "That didn't look like a number of kilos.";
      S.lifts[ex.name] = {target:t, inc: (!isNaN(i) && i>=0) ? i : lift.inc};
      return null;
    },
  };
  render();
}

function openEditSheet(ex){
  if (!ex) return;
  S.sheet = {
    title:"Edit exercise",
    sub:"Renaming starts a fresh history, because logged sets are keyed by exercise name.",
    fields:[
      {key:"name", label:"Name", value:ex.name, text:true},
      {key:"reps", label:"Sets × reps", value:ex.reps.join(", "), text:true},
    ],
    onSave(vals){
      const name = (vals.name||"").trim();
      const reps = parseReps(vals.reps);
      if (!name) return "It needs a name.";
      if (!reps.length) return "It needs at least one set.";
      ex.name = name; ex.reps = reps;
      if (!ex.bw && !S.lifts[name]) S.lifts[name] = {target:0, inc:2.5};
      return null;
    },
  };
  render();
}

function renderSheet(){
  const old = document.querySelector(".sheet");
  if (old) old.remove();
  if (!S.sheet) return;
  const sh = S.sheet;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-inner">
    <div class="sheet-title">${esc(sh.title)}</div>
    <div class="sheet-sub">${esc(sh.sub)}</div>
    ${sh.fields.map(f => `
      <label class="flabel">${esc(f.label)}</label>
      <input class="input" data-f="${esc(f.key)}"
        type="${f.text?"text":"text"}" inputmode="${f.text?"text":"decimal"}"
        value="${esc(f.value)}">`).join("")}
    <div class="notice warn" id="sheet-msg"></div>
    <button class="btn" id="sheet-save">Save</button>
    <button class="btn sec" id="sheet-cancel">Cancel</button>
  </div>`;
  document.body.appendChild(el);

  el.querySelector("#sheet-cancel").onclick = () => { S.sheet = null; render(); };
  el.onclick = e => { if (e.target === el){ S.sheet = null; render(); } };
  el.querySelector("#sheet-save").onclick = () => {
    const vals = {};
    el.querySelectorAll("[data-f]").forEach(i => vals[i.dataset.f] = i.value);
    const err = sh.onSave(vals);
    if (err){ el.querySelector("#sheet-msg").textContent = err; return; }
    S.sheet = null;
    render();
  };
}

const avg = a => Math.round(a.reduce((x,y)=>x+y,0)/a.length);

function mealTotal(items){
  return items.reduce((a,i)=>({
    kcal:a.kcal+i.kcal, p:a.p+i.p, c:a.c+i.c, f:a.f+i.f
  }), {kcal:0,p:0,c:0,f:0});
}

// Canned stand-ins for the vision call. Per-100g figures, so editing the
// grams rescales exactly as the real version does.
const CANNED = [
  {label:"Mixed plate", items:[
    {name:"Grilled chicken thigh", g:140, per:{kcal:203, p:24.3, c:0, f:11.4}},
    {name:"Steamed rice",          g:180, per:{kcal:130, p:2.7,  c:28.2, f:0.3}},
    {name:"Mixed salad, no dressing", g:120, per:{kcal:32, p:1.5, c:5.8, f:0.2}},
    {name:"Olive oil, drizzled",   g:18,  per:{kcal:884, p:0, c:0, f:100}},
  ]},
  {label:"Nutrition label — oat biscuits", items:[
    {name:"Oat biscuits (from label)", g:60, per:{kcal:452, p:7.1, c:64, f:18.2}},
  ]},
  {label:"On the scale — paneer", items:[
    {name:"Paneer (scale reads 150g)", g:150, per:{kcal:296, p:18.3, c:1.2, f:24.1}},
  ]},
];
let cannedIdx = 0;

function rescale(items){
  items.forEach(it => {
    const k = it.g/100;
    it.kcal = Math.round(it.per.kcal*k);
    it.p = Math.round(it.per.p*k);
    it.c = Math.round(it.per.c*k);
    it.f = Math.round(it.per.f*k);
  });
  return items;
}

function makeCanned(){
  const src = CANNED[cannedIdx++ % CANNED.length];
  return {label:src.label, items:rescale(src.items.map(i => ({...i, per:{...i.per}})))};
}

function wireDiet(){
  const q = s => content().querySelector(s);
  const qa = s => content().querySelectorAll(s);

  q("#meal-estimate").onclick = () => {
    const txt = q("#meal-text").value.trim();
    const msg = q("#meal-msg");
    if (!txt){ msg.textContent = "Type what you ate first."; msg.className="notice warn"; return; }
    // Crude but honest: the demo doesn't guess macros, it shows a fixed example.
    S.meals.push({name:txt, kcal:430, p:28, c:44, f:14});
    q("#meal-text").value = "";
    render();
  };

  q("#meal-cam").onclick = () => { S.camOpen = true; render(); };
  q("#meal-pick").onclick = () => { S.pendingMeal = makeCanned(); render(); };

  qa("[data-item]").forEach(inp => {
    inp.oninput = () => {
      const it = S.pendingMeal.items[Number(inp.dataset.item)];
      it.g = Math.max(0, parseFloat(inp.value) || 0);
      rescale(S.pendingMeal.items);
      // Re-render just the numbers so the cursor stays put.
      const rows = content().querySelectorAll(".meal-row .meal-sub");
      S.pendingMeal.items.forEach((x,i) => {
        if (rows[i]) rows[i].textContent = `${x.kcal} kcal · ${x.p}P / ${x.c}C / ${x.f}F`;
      });
      const tot = mealTotal(S.pendingMeal.items);
      const b = content().querySelector(".target.plain b");
      if (b) b.textContent = tot.kcal + " kcal";
    };
  });

  const save = q("#save-meal");
  if (save) save.onclick = () => {
    const t = mealTotal(S.pendingMeal.items);
    S.meals.push({name:S.pendingMeal.label, kcal:t.kcal, p:t.p, c:t.c, f:t.f});
    S.pendingMeal = null;
    render();
  };
  const drop = q("#drop-meal");
  if (drop) drop.onclick = () => { S.pendingMeal = null; render(); };

  qa("[data-delmeal]").forEach(b => b.onclick = () => {
    S.meals.splice(Number(b.dataset.delmeal), 1);
    render();
  });
}

function renderCam(){
  const old = document.querySelector(".cam");
  if (old) old.remove();
  if (!S.camOpen) return;
  const el = document.createElement("div");
  el.className = "cam";
  el.innerHTML = `
    <div class="cam-view"></div>
    <div class="cam-msg">Point at the label, the scale display, or the plate.</div>
    <div class="cam-bar">
      <button class="cam-side" id="cam-cancel" style="text-align:left">Cancel</button>
      <button class="cam-shutter" id="cam-shoot" aria-label="Take photo"></button>
      <button class="cam-side" style="text-align:right">Flip</button>
    </div>`;
  document.body.appendChild(el);
  el.querySelector("#cam-cancel").onclick = () => { S.camOpen = false; render(); };
  el.querySelector("#cam-shoot").onclick = () => {
    S.camOpen = false;
    S.pendingMeal = makeCanned();
    render();
  };
}

/* ---------------- STATS ---------------- */
// Best top set per month per exercise, skipped sessions excluded.
function analyse(){
  const names = new Set();
  Object.keys(S.logs).forEach(k => names.add(k.split("|")[3]));

  const out = [];
  names.forEach(name => {
    const byMonth = {};
    const myDays = new Set();
    Object.keys(S.logs).forEach(k => {
      const [m,w,d,n] = k.split("|");
      if (n !== name) return;
      myDays.add(Number(d));
      if (S.skipped[`${m}|${w}|${d}`] !== undefined) return;   // skipped: ignore
      const vals = S.logs[k].map(v=>parseFloat(v)).filter(x=>!isNaN(x)&&x>0);
      if (!vals.length) return;
      const top = Math.max(...vals);
      if (byMonth[m] == null || top > byMonth[m]) byMonth[m] = top;
    });
    const months = Object.keys(byMonth).sort();
    if (months.length < 2){
      out.push({name, status:"insufficient",
        detail:"Log this lift across 2+ months to see a trend."});
      return;
    }
    const pm = months[months.length-2], lm = months[months.length-1];
    const prev = byMonth[pm], last = byMonth[lm];
    if (last <= prev){
      // A skip on one of THIS lift's days excuses it; an unrelated skip doesn't.
      const skips = Object.keys(S.skipped).filter(k => {
        const [m,, d] = k.split("|");
        return m === lm && myDays.has(Number(d));
      }).length;
      if (skips > 0){
        out.push({name, status:"incomplete",
          detail:`Top set is ${last}kg vs ${prev}kg in ${pm}, but you skipped ${skips} session${skips===1?"":"s"} in ${lm} — too few attempts to call this a stall.`});
      } else {
        out.push({name, status:"stalled",
          detail:`Top set hasn't gone up: ${prev}kg (${pm}) → ${last}kg (${lm}).`});
      }
    } else {
      out.push({name, status:"progressing",
        detail:`+${round1(last-prev)}kg since ${pm} (${prev}kg → ${last}kg).`});
    }
  });
  const order = {stalled:0, incomplete:1, insufficient:2, progressing:3};
  return out.sort((a,b)=>order[a.status]-order[b.status]);
}

const BALANCE = [{
  label:"Row vs Incline Bench", a:"Barbell Bent-over Row", b:"Incline Bench Press",
  min:0.9, max:1.2,
  low:"Horizontal pull is behind your pressing — prioritise back thickness work.",
  high:"Row is well ahead of pressing — chest and shoulders need priority.",
}];

function renderStats(){
  setHeader("Analysis", "Bottlenecks & strength balance", null);
  const LABEL = {stalled:"Stalled", progressing:"Progressing",
                 insufficient:"Not enough data", incomplete:"Sessions skipped"};
  const CLS = {stalled:"bad", progressing:"good", insufficient:"neutral", incomplete:"warn"};

  // bodyweight trend as a % of bodyweight per week
  const bw = S.bodyweight;
  const first = bw[0], last = bw[bw.length-1];
  const weeks = (new Date(last.d) - new Date(first.d)) / (1000*60*60*24*7);
  const perWk = weeks > 0 ? (last.kg - first.kg)/weeks : 0;
  const pctWk = last.kg ? perWk/last.kg*100 : 0;
  const lean = k => round1(k.kg * (1 - k.bf/100));

  const xs = bw.map((_,i)=> 4 + i*(332/(bw.length-1)));
  const lo = Math.min(...bw.map(b=>b.kg)) - 0.3, hi = Math.max(...bw.map(b=>b.kg)) + 0.3;
  const ys = bw.map(b => 40 - (b.kg - lo)/(hi-lo)*34);

  let h = `<div class="card">
    <div class="row" style="align-items:center">
      <div><div class="ex-name" style="font-size:13px">Bodyweight</div>
        <div class="ex-meta">${last.kg} kg · lean ${lean(last)} kg at ${last.bf}% fat</div></div>
      <span class="badge ${Math.abs(pctWk) < 0.1 ? "neutral" : (pctWk>0?"good":"warn")}">
        ${pctWk>=0?"+":""}${pctWk.toFixed(2)}%/wk</span>
    </div>
    <svg class="spark" viewBox="0 0 340 46" preserveAspectRatio="none">
      <polyline fill="none" stroke="#60a5fa" stroke-width="2"
        points="${xs.map((x,i)=>`${x.toFixed(0)},${ys[i].toFixed(0)}`).join(" ")}"/>
    </svg>
    <div class="notes">Lean mass ${round1(lean(last)-lean(first))>=0?"+":""}${round1(lean(last)-lean(first))} kg
      and fat ${round1((last.kg-lean(last))-(first.kg-lean(first)))>=0?"+":""}${round1((last.kg-lean(last))-(first.kg-lean(first)))} kg
      since ${first.d}. Rate is expressed as a percentage of bodyweight, not raw kilos.</div>
  </div>`;

  h += `<div class="block-label">Stalled / progressing</div>`;
  const rows = analyse();
  if (!rows.length) h += `<div class="card"><div class="notes" style="margin:0">Log some sets on the Train tab and this fills in.</div></div>`;
  rows.forEach(r => {
    h += `<div class="card">
      <div class="row" style="align-items:center">
        <div class="ex-name" style="font-size:13px">${esc(r.name)}</div>
        <span class="badge ${CLS[r.status]}">${LABEL[r.status]}</span>
      </div>
      <div class="notes">${esc(r.detail)}</div></div>`;
  });

  h += `<div class="block-label cond">Strength balance</div>`;
  BALANCE.forEach(c => {
    const A = S.lifts[c.a], B = S.lifts[c.b];
    if (!A || !B || !A.target || !B.target){
      h += `<div class="card"><div class="row" style="align-items:center">
        <div class="ex-name" style="font-size:13px">${esc(c.label)}</div>
        <span class="badge neutral">Not enough data</span></div>
        <div class="notes">Needs a target on both lifts.</div></div>`;
      return;
    }
    const ratio = A.target/B.target;
    const status = ratio < c.min ? "warn" : (ratio > c.max ? "warn" : "good");
    const label  = ratio < c.min ? "Lagging" : (ratio > c.max ? "Ahead" : "Balanced");
    const msg = ratio < c.min ? c.low : (ratio > c.max ? c.high
      : `Ratio ${ratio.toFixed(2)} — inside the typical ${c.min}–${c.max} range.`);
    h += `<div class="card">
      <div class="row" style="align-items:center">
        <div class="ex-name" style="font-size:13px">${esc(c.label)}</div>
        <span class="badge ${status}">${label}</span></div>
      <div class="notes">Ratio ${ratio.toFixed(2)}. ${esc(msg)}</div></div>`;
  });

  h += `<div class="card"><div class="notes" style="margin:0">
    These are rules of thumb used by coaches, not exact science. They point at what to
    look at, they don't diagnose anything.</div></div>`;

  content().innerHTML = h;
}

/* ---------------- SETUP ---------------- */
function renderSetup(){
  setHeader("Setup", "Targets & goal", null);
  const names = Object.keys(S.lifts);
  let h = `<div class="card">
    <div class="notes" style="margin:0"><b>Changing your workouts?</b> Do it on the
      <b>Train</b> tab — open a day, name it, and use <b>Add to this day</b>.
      Each month is separate.</div></div>`;

  h += `<div class="block-label">Goal</div><div class="card">`;
  h += `<label class="flabel">Goal</label>
    <select class="input" id="goal-sel">
      ${Object.entries(GOALS).map(([k,g])=>
        `<option value="${k}" ${k===S.profile.goal?"selected":""}>${g.label}</option>`).join("")}
    </select>
    <label class="flabel">Bodyweight (kg)</label>
    <input class="input" id="p-weight" inputmode="decimal" value="${S.profile.weightKg}">
    <label class="flabel">Body fat (%) — from a BIA scale</label>
    <input class="input" id="p-bf" inputmode="decimal" value="${S.profile.bfPct}">
    <div class="notes">With a body-fat figure the calorie target uses Katch-McArdle,
      which works off lean mass. Clear it and it falls back to Mifflin-St Jeor.</div>
    <button class="btn" id="save-profile">Save</button></div>`;

  h += `<div class="block-label">Lift targets</div>`;
  if (!names.length) h += `<div class="card"><div class="notes" style="margin:0">Add exercises on the Train tab and they appear here.</div></div>`;
  names.forEach(n => {
    const l = S.lifts[n];
    h += `<div class="card">
      <div class="row" style="align-items:center">
        <div class="ex-name" style="font-size:13px">${esc(n)}</div>
        <span class="badge neutral">${l.target ? l.target+" kg" : "no target yet"}</span>
      </div>
      <div class="notes">Goes up ${l.inc} kg each time you hit it.
        Week 4 shows ${l.target ? roundTo(l.target*0.9, stepFor(l))+" kg" : "—"} as a deload.</div>
    </div>`;
  });

  content().innerHTML = h;

  content().querySelector("#save-profile").onclick = () => {
    S.profile.goal = content().querySelector("#goal-sel").value;
    S.profile.weightKg = parseFloat(content().querySelector("#p-weight").value) || S.profile.weightKg;
    const bf = parseFloat(content().querySelector("#p-bf").value);
    S.profile.bfPct = isNaN(bf) ? 0 : bf;
    S.tab = "diet";
    render();
  };
}

/* ---------------- boot ---------------- */
document.getElementById("reset-demo").onclick = () => {
  seq = 0; cannedIdx = 0;
  S = freshState();
  render();
};
render();
